<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGuide - Health Blog</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
    padding: 2rem 1.5rem;
    color: #1a2c3e;
}

.blog-container {
    max-width: 1400px;
    margin: 0 auto;
}

/* ========== PAGE HEADER ========== */
.page-header {
    text-align: center;
    margin-bottom: 2.5rem;
    padding: 0.5rem;
}

.title-badge {
    display: inline-block;
    background: linear-gradient(135deg, #e67e22, #d35400);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 5px 18px;
    border-radius: 30px;
    margin-bottom: 1rem;
    box-shadow: 0 2px 8px rgba(230,126,34,0.3);
}

.page-header h1 {
    font-size: 3rem;
    margin-bottom: 0.8rem;
    letter-spacing: -0.5px;
}

.title-gradient {
    background: linear-gradient(135deg, #2c3e50, #34495e);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    font-weight: 800;
}

.title-highlight {
    background: linear-gradient(135deg, #e67e22, #f39c12);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    font-weight: 800;
    position: relative;
}

.title-highlight::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #e67e22, #f39c12);
    border-radius: 3px;
}

.sub {
    font-size: 0.95rem;
    color: #e67e22;
    margin-top: 12px;
    font-weight: 600;
    background: rgba(230,126,34,0.1);
    display: inline-block;
    padding: 6px 24px;
    border-radius: 40px;
}

.description-box {
    max-width: 750px;
    margin: 20px auto 0;
    background: white;
    padding: 18px 24px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    border-left: 5px solid #e67e22;
    text-align: left;
}

.description-box p {
    color: #4a627a;
    font-weight: 450;
    line-height: 1.5;
    font-size: 0.9rem;
}

/* ========== RESULTS INFO ========== */
.results-info {
    text-align: center;
    padding: 8px 20px;
    margin-bottom: 35px;
    background: linear-gradient(135deg, #e67e22, #f39c12);
    border-radius: 40px;
    max-width: 220px;
    margin-left: auto;
    margin-right: auto;
    font-weight: 600;
    font-size: 0.85rem;
    color: white;
    box-shadow: 0 2px 8px rgba(230,126,34,0.2);
}

/* ========== BLOG GRID ========== */
.blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 30px;
}

/* ========== BLOG CARD ========== */
.blog-card {
    border-radius: 24px;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    cursor: pointer;
}

.blog-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
}

/* Card Background Colors */
.card-bg-prevention { background: linear-gradient(135deg, #e3f2fd, #bbdef5); }
.card-bg-lifestyle { background: linear-gradient(135deg, #fff3e0, #ffe0b2); }
.card-bg-medicine { background: linear-gradient(135deg, #f3e5f5, #e1bee7); }
.card-bg-mental { background: linear-gradient(135deg, #e0f2f1, #b2dfdb); }
.card-bg-firstaid { background: linear-gradient(135deg, #ffebee, #ffcdd2); }
.card-bg-nutrition { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); }

/* Card Content */
.blog-content {
    padding: 28px;
}

/* Category Badge */
.blog-category {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 25px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
}

.cat-prevention { background: #1565c0; color: white; }
.cat-lifestyle { background: #e65100; color: white; }
.cat-medicine { background: #6a1b9a; color: white; }
.cat-mental { background: #00695c; color: white; }
.cat-firstaid { background: #c62828; color: white; }
.cat-nutrition { background: #2e7d32; color: white; }

/* Blog Title */
.blog-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: #1a2c3e;
    margin-bottom: 14px;
    line-height: 1.35;
}

/* Blog Preview */
.blog-preview {
    font-size: 0.9rem;
    color: #4a627a;
    line-height: 1.55;
    margin-bottom: 20px;
}

/* Blog Meta */
.blog-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 14px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
}

.blog-date {
    font-size: 0.75rem;
    color: #5a6e7c;
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 500;
}

.read-link {
    font-size: 0.8rem;
    font-weight: 700;
    color: #e67e22;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: 0.3s;
}

.read-link:hover {
    gap: 10px;
    color: #d35400;
}

/* ========== MODAL STYLES ========== */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(5px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    border-radius: 28px;
    max-width: 700px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    animation: modalSlideIn 0.3s ease;
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.close-modal {
    position: sticky;
    top: 15px;
    right: 20px;
    float: right;
    font-size: 30px;
    font-weight: bold;
    color: #aaa;
    cursor: pointer;
    background: white;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    z-index: 10;
    transition: 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.close-modal:hover {
    color: #333;
    background: #f0f0f0;
}

.modal-body {
    padding: 32px;
    clear: both;
}

.modal-title {
    font-size: 1.8rem;
    font-weight: 800;
    color: #1a2c3e;
    margin-bottom: 12px;
}

.modal-date {
    font-size: 0.8rem;
    color: #7f8c8d;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid #e67e22;
    display: inline-block;
}

.modal-category {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 25px;
    font-size: 0.7rem;
    font-weight: 700;
    margin-left: 12px;
    color: white;
}

.modal-section {
    margin-bottom: 22px;
}

.modal-section h4 {
    color: #e67e22;
    margin-bottom: 12px;
    font-size: 1.05rem;
    font-weight: 700;
}

.modal-section p {
    color: #4a627a;
    line-height: 1.65;
    font-size: 0.95rem;
}

.modal-section ul {
    margin-left: 20px;
    color: #4a627a;
    line-height: 1.65;
}

.modal-section li {
    margin: 8px 0;
}

.modal-warning {
    background: #fef9e8;
    padding: 14px 18px;
    border-radius: 14px;
    margin-top: 20px;
    font-size: 0.8rem;
    color: #856404;
    border-left: 4px solid #e67e22;
}

/* Responsive */
@media (max-width: 768px) {
    body {
        padding: 1rem;
    }
    
    .page-header h1 {
        font-size: 2rem;
    }
    
    .title-highlight::after {
        bottom: -5px;
    }
    
    .blog-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }
    
    .blog-content {
        padding: 20px;
    }
    
    .blog-title {
        font-size: 1.2rem;
    }
    
    .modal-title {
        font-size: 1.4rem;
    }
    
    .modal-body {
        padding: 20px;
    }
}
</style>

</head>

// Function to create blog card
function createBlogCard(post) {
    return `
        <div class="blog-card ${post.cardBg}" data-id="${post.id}">
            <div class="blog-content">
                <span class="blog-category cat-${post.category}">${post.categoryName}</span>
                <h3 class="blog-title">${post.title}</h3>
                <p class="blog-preview">${post.preview}</p>
                <div class="blog-meta">
                    <span class="blog-date">📅 ${post.date}</span>
                    <span class="read-link">Read Article →</span>
                </div>
            </div>
        </div>
    `;
}

// Render all blog posts
function renderBlogPosts() {
    const grid = document.getElementById('blogGrid');
    const resultsInfo = document.getElementById('resultsInfo');
    
    grid.innerHTML = blogPosts.map(createBlogCard).join('');
    resultsInfo.innerHTML = `📄 Showing ${blogPosts.length} in-depth articles`;
    
    document.querySelectorAll('.blog-card').forEach(card => {
        card.addEventListener('click', (e) => {
            if (e.target.classList.contains('read-link')) {
                e.stopPropagation();
            }
            const id = parseInt(card.getAttribute('data-id'));
            const post = blogPosts.find(p => p.id === id);
            if (post) {
                showModal(post);
            }
        });
    });
}

// Show modal with expanded article
function showModal(post) {
    const modal = document.getElementById('articleModal');
    const modalBody = document.getElementById('modalBody');
    
    // Generate practical steps HTML
    let stepsHtml = '';
    if (post.content.practicalSteps) {
        stepsHtml = `
            <div class="modal-section">
                <h4>📋 Practical Steps</h4>
                <ul>
                    ${post.content.practicalSteps.map(step => `<li><strong>${step.title}</strong><br>${step.desc}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    // Generate common mistakes HTML
    let mistakesHtml = '';
    if (post.content.commonMistakes) {
        mistakesHtml = `
            <div class="modal-section">
                <h4>❌ Common Mistakes to Avoid</h4>
                <ul>
                    ${post.content.commonMistakes.map(mistake => `<li>${mistake}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    // Generate when to see doctor HTML
    let doctorHtml = '';
    if (post.content.whenToSeeDoctor) {
        doctorHtml = `
            <div class="modal-section">
                <h4>🚨 When to See a Doctor</h4>
                <ul>
                    ${post.content.whenToSeeDoctor.map(symptom => `<li>${symptom}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    // Generate home care HTML (if exists)
    let homeCareHtml = '';
    if (post.content.homeCare) {
        homeCareHtml = `
            <div class="modal-section">
                <h4>🏠 Home Care Tips</h4>
                <ul>
                    ${post.content.homeCare.map(tip => `<li>${tip}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    // Generate minor burns/cuts HTML (if exists)
    let burnsHtml = '';
    if (post.content.minorBurns) {
        burnsHtml = `
            <div class="modal-section">
                <h4>🔥 For Minor Burns</h4>
                <ul>
                    ${post.content.minorBurns.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    let cutsHtml = '';
    if (post.content.minorCuts) {
        cutsHtml = `
            <div class="modal-section">
                <h4>🩹 For Minor Cuts</h4>
                <ul>
                    ${post.content.minorCuts.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    modalBody.innerHTML = `
        <div class="modal-title">${post.title}</div>
        <div>
            <span class="modal-date">📅 ${post.date}</span>
            <span class="modal-category cat-${post.category}">${post.categoryName}</span>
        </div>
        <div class="modal-section">
            <h4>📖 Introduction</h4>
            <p>${post.content.introduction}</p>
        </div>
        <div class="modal-section">
            <h4>⚠️ Why It Matters</h4>
            <p>${post.content.whyItMatters}</p>
        </div>
        ${stepsHtml}
        ${mistakesHtml}
        ${homeCareHtml}
        ${burnsHtml}
        ${cutsHtml}
        ${doctorHtml}
        <div class="modal-section">
            <h4>📝 Summary</h4>
            <p>${post.content.summary}</p>
        </div>
        <div class="modal-warning">
            ⚠️ Disclaimer: This information is for educational purposes only. Consult a healthcare professional for medical advice.
        </div>
    `;
    
    modal.style.display = 'flex';
}

// Setup modal close
function setupModal() {
    const modal = document.getElementById('articleModal');
    const closeBtn = document.querySelector('.close-modal');
    
    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });
    
    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    renderBlogPosts();
    setupModal();
});
