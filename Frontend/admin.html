<title>Admin Dashboard | CareCompass</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    header {
      background: #0a1a3c;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }
    table {
      width: 100%;
      background: white;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #0a1a3c;
      color: white;
    }
    .confirm {
      background: green;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .cancel {
      background: red;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .logout {
      background: #ff4444;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    h3 {
      margin-top: 30px;
      margin-bottom: 15px;
      color: #0a1a3c;
    }
  </style>
</head>
<body>
  <header>
    <h2>👑 Admin Panel - CareCompass</h2>
    <button class="logout" onclick="logout()">Logout</button>
  </header>
  <div class="container">
    <h3>📋 All Appointments</h3>
    <table id="appointmentsTable">
      <thead>
        <tr><th>Patient</th><th>Email</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>📧 Contact Messages</h3>
    <table id="contactsTable">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>💰 Payments</h3>
    <table id="paymentsTable">
      <thead>
        <tr><th>Patient</th><th>Doctor</th><th>Amount</th><th>Card</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // ========== FIX 2: Better admin check ==========
    const user = JSON.parse(localStorage.getItem('currentUser'));
    const userRole = localStorage.getItem('userRole');
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    
    console.log('Admin check - isLoggedIn:', isLoggedIn);
    console.log('Admin check - userRole:', userRole);
    console.log('Admin check - currentUser:', user);
    
    // Check both formats
    if (!isLoggedIn || isLoggedIn !== 'true') {
      alert('Please login first');
      window.location.href = 'login.html';
    }
    
    if (userRole !== 'admin' && (!user || user.role !== 'admin')) {
      alert('Admin access only! You are not authorized.');
      window.location.href = 'login.html';
    }

    // ========== LOAD APPOINTMENTS ==========
    async function loadAppointments() {
      try {
        const res = await fetch('http://localhost:5000/api/appointments/all');
        const appointments = await res.json();
        let html = '';
        appointments.forEach(apt => {
          html += `
            <tr>
              <td>${apt.patientName}</td>
              <td>${apt.email}</td>
              <td>${apt.doctorName}</td>
              <td>${apt.date}</td>
              <td>${apt.time || '-'}</td>
              <td>${apt.status}</td>
              <td>
                ${apt.status === 'pending' ? `<button class="confirm" onclick="updateStatus('${apt._id}', 'confirmed')">Confirm</button>` : ''}
                ${apt.status !== 'cancelled' ? `<button class="cancel" onclick="updateStatus('${apt._id}', 'cancelled')">Cancel</button>` : ''}
              </td>
            </tr>
          `;
        });
        document.querySelector('#appointmentsTable tbody').innerHTML = html;
      } catch (error) {
        console.error('Error loading appointments:', error);
        document.querySelector('#appointmentsTable tbody').innerHTML = '<tr><td colspan="7">Error loading appointments</td></tr>';
      }
    }

    async function updateStatus(id, status) {
      try {
        await fetch(`http://localhost:5000/api/appointments/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        loadAppointments();
      } catch (error) {
        console.error('Error updating status:', error);
      }
    }

    // ========== LOAD CONTACTS ==========
    async function loadContacts() {
      try {
        const res = await fetch('http://localhost:5000/api/contact');
        const messages = await res.json();
        let html = '';
        messages.forEach(msg => {
          html += `
            <tr>
              <td>${msg.name}</td>
              <td>${msg.email}</td>
              <td>${msg.subject || '-'}</td>
              <td>${msg.message}</td>
              <td>${new Date(msg.createdAt).toLocaleDateString()}</td>
            </tr>
          `;
        });
        document.querySelector('#contactsTable tbody').innerHTML = html;
      } catch (error) {
        console.error('Error loading contacts:', error);
      }
    }

    // ========== LOAD PAYMENTS ==========
    async function loadPayments() {
      try {
        const res = await fetch('http://localhost:5000/api/payments/all');
        const payments = await res.json();
        let html = '';
        payments.forEach(p => {
          html += `
            <tr>
              <td>${p.patientName}</td>
              <td>${p.doctorName}</td>
              <td>₨ ${p.amount}</td>
              <td>****${p.cardNumber?.slice(-4) || '****'}</td>
              <td>${new Date(p.createdAt).toLocaleDateString()}</td>
            </tr>
          `;
        });
        document.querySelector('#paymentsTable tbody').innerHTML = html;
      } catch (error) {
        console.error('Error loading payments:', error);
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('userName');
      localStorage.removeItem('userEmail');
      localStorage.removeItem('userRole');
      window.location.href = 'login.html';
    }

    // Load all data
    loadAppointments();
    loadContacts();
    loadPayments();
  </script>
</body>
</html>
